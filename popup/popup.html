<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salesforce Debug Log Beautifier</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 240px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ffffff;
      color: #2c3e50;
      padding: 0;
      border-radius: 8px;
      overflow: hidden;
    }

    .popup-container {
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0176d3, #005fb2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: white;
      margin: 0 auto 16px;
      box-shadow: 0 4px 12px rgba(1, 118, 211, 0.3);
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #2c3e50;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .dashboard-btn {
      background: linear-gradient(135deg, #0176d3, #005fb2);
      border: none;
      color: white;
      padding: 14px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(1, 118, 211, 0.25);
    }

    .dashboard-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(1, 118, 211, 0.35);
    }

    .dashboard-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(1, 118, 211, 0.25);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: #6c757d;
      margin-top: 12px;
      padding: 8px 12px;
      background: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #28a745;
      animation: pulse 2s infinite;
    }

    .status-dot.disconnected {
      background: #ffc107;
    }

    .status-dot.error {
      background: #dc3545;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .org-info {
      text-align: center;
      margin-top: 12px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }

    .org-info .org-label {
      font-size: 11px;
      color: #6c757d;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .org-info .org-name {
      font-size: 13px;
      font-weight: 500;
      color: #2c3e50;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #6c757d;
      padding: 12px 20px;
      border-top: 1px solid #e9ecef;
      background: #f8f9fa;
    }

    /* Icon for the dashboard button */
    .dashboard-btn::before {
      content: "";
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <h1>Salesforce Debug Log Beautifier</h1>
    <p class="subtitle">Beautify and analyze Salesforce debug logs with syntax highlighting and smart polling</p>
    
    <button class="dashboard-btn" id="openDashboardBtn">
      Open Debug Log
    </button>
    
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Checking connection...</span>
    </div>
  </div>
  
  <div class="footer">
    Click dashboard to access all features
  </div>

  <script src="popup.js"></script>
</body>
</html>
