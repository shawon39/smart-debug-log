<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Log Beautifier</title>
  <link rel="stylesheet" href="../css/popup-theme.css">
  <link rel="stylesheet" href="../css/popup-base.css">
</head>

<body>
  <header class="popup-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="3" width="8.5" height="1.6" rx="0.8" fill="currentColor" />
          <rect x="2" y="7" width="12" height="1.6" rx="0.8" fill="currentColor" />
          <rect x="2" y="11" width="6.5" height="1.6" rx="0.8" fill="currentColor" />
          <path d="M12.8 1.6l.45 1.25 1.25.45-1.25.45-.45 1.25-.45-1.25-1.25-.45 1.25-.45z" fill="currentColor" />
        </svg>
      </span>
      <div class="brand-text">
        <div class="brand-name">Debug Log Beautifier</div>
        <div class="brand-sub">for Salesforce</div>
      </div>
    </div>

    <label class="theme-switch" for="themeToggle" title="Toggle dark mode">
      <input type="checkbox" id="themeToggle">
      <span class="theme-track">
        <span class="theme-knob">
          <svg class="theme-i sun" width="12" height="12" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <circle cx="7" cy="7" r="2.6" fill="none" />
              <path d="M7 1v1.4M7 11.6V13M1 7h1.4M11.6 7H13M2.8 2.8l1 1M10.2 10.2l1 1M11.2 2.8l-1 1M3.8 10.2l-1 1" />
            </g>
          </svg>
          <svg class="theme-i moon" width="12" height="12" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.6 8.7A4.7 4.7 0 0 1 5.9 3a.6.6 0 0 0-.82-.72 5.3 5.3 0 1 0 7.05 7.05.6.6 0 0 0-.53-.63z" fill="currentColor" />
          </svg>
        </span>
      </span>
    </label>
  </header>

  <div class="popup-body">

    <!-- Status card: org connection + access token + debug-logging (needs the token) -->
    <section class="status-card" id="statusCard" style="display: none;">
      <!-- Org row -->
      <div class="card-row org-row">
        <span class="row-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4.8 12.5A2.8 2.8 0 0 1 4.4 6.96 3.6 3.6 0 0 1 11.3 6.4a2.55 2.55 0 0 1-.25 6.1H4.8z"
              fill="currentColor" />
          </svg>
        </span>
        <span class="org-name mono" id="orgName">--</span>
        <span class="conn-state"><span class="dot dot-success"></span>logged in</span>
      </div>

      <!-- Token row -->
      <div class="card-row token-row" id="tokenRow">
        <span class="row-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M10 2a4 4 0 0 0-3.86 5.05L2 11.2V14h2.8l.7-.7.9.9 1.1-1.1-.9-.9.86-.86A4 4 0 1 0 10 2zm1.4 2.6a1.1 1.1 0 1 1-1.56 1.56A1.1 1.1 0 0 1 11.4 4.6z"
              fill="currentColor" />
          </svg>
        </span>
        <div class="row-text">
          <span class="row-label">Access token</span>
          <span class="row-hint" id="tokenHint">Needed to read your logs</span>
        </div>
        <span class="token-pill" id="tokenPill">None</span>
        <button class="inline-action" id="generateTokenBtn">Generate</button>
        <button class="inline-action danger" id="revokeTokenBtn" style="display: none;">Revoke</button>
      </div>

      <!-- Logging row -->
      <div class="card-row logging-row" id="loggingRow">
        <div class="logging-head">
          <span class="dot logging-dot" id="loggingDot"></span>
          <span class="logging-label" id="loggingStatusText">Not recording your debug logs</span>
          <span class="logging-countdown mono" id="loggingCountdown"></span>
        </div>
        <div class="logging-controls">
          <select class="duration-select" id="durationSelect" aria-label="Logging duration">
            <option value="15">15m</option>
            <option value="30">30m</option>
            <option value="60">1h</option>
          </select>
          <button class="logging-action" id="enableLoggingBtn">Start</button>
        </div>
      </div>
    </section>

    <!-- Not on Salesforce notification -->
    <div class="notification-wrapper" id="notOnSalesforceNotification" style="display: none;">
      <div class="notification">
        <span class="notification-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
              fill="currentColor" />
          </svg>
        </span>
        <div class="notification-content">
          <div class="notification-title">You're not on Salesforce</div>
          <div class="notification-message">
            Open your Salesforce org (*.salesforce.com, *.force.com), then reopen this popup.
          </div>
        </div>
      </div>
    </div>

    <!-- Error line (filled by popup.js) -->
    <div class="popup-error" id="popupError" role="alert" hidden></div>

    <button class="cta-primary" id="openDashboardBtn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2.5" y="1.8" width="11" height="12.4" rx="2" stroke="currentColor" stroke-width="1.3" fill="none" />
        <path d="M5 5.2h6M5 8h6M5 10.8h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
      </svg>
      <span>View Debug Logs</span>
    </button>

    <div class="popup-footer">
      <kbd class="kbd">Option/Alt</kbd>
      <kbd class="kbd">Shift</kbd>
      <kbd class="kbd">D</kbd>
      <span class="footer-label">open dashboard</span>
    </div>

    <script src="../js/basic-utilities.js"></script>
    <script src="popup.js"></script>
</body>

</html>
