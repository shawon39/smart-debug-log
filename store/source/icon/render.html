<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Icon</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  img { display: block; }
</style>
</head>
<body>
<script>
  // ?size=16|32|48|128, &store=1 adds the 16px transparent padding the Web Store asks for
  const params = new URLSearchParams(location.search);
  const size = Number(params.get('size')) || 128;
  const padded = params.get('store') === '1' || size === 128;
  const img = new Image();
  img.src = size === 16 ? 'icon-16.svg' : 'icon.svg';
  const art = padded ? 96 : size;
  img.width = art;
  img.height = art;
  img.style.margin = padded ? '16px' : '0';
  img.onload = () => { document.documentElement.dataset.ready = '1'; };
  document.body.appendChild(img);
</script>
</body>
</html>
